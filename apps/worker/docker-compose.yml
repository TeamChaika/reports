services:
  iiko-worker:
    build: .
    image: chaika-iiko-worker
    container_name: chaika-iiko-worker
    restart: unless-stopped
    env_file:
      - .env
    # No ports — it only makes outbound calls to iiko + Supabase
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
